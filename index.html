<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A wish was left for you ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Dancing+Script:wght@500&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Quicksand',system-ui,sans-serif;color:#ffe9c7}
body{background:linear-gradient(180deg,#0b0620 0%,#241046 55%,#4a1d5e 100%)}
#sky{position:fixed;inset:0;width:100%;height:100%}
.moon{position:fixed;top:7%;right:9%;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffdf0,#f3e2a0);box-shadow:0 0 40px 12px rgba(255,240,180,.35)}
#con{position:fixed;left:50%;top:50%;width:min(88vw,380px);transform:translate(-50%,-52%);opacity:0;transition:opacity 1.5s;filter:drop-shadow(0 0 6px rgba(255,214,120,.6));pointer-events:none}
#con.show{opacity:1}#con.dim{opacity:.2}
#con.love{opacity:1;filter:drop-shadow(0 0 14px rgba(255,140,190,.9));animation:beat 1.4s infinite}
@keyframes beat{50%{transform:translate(-50%,-52%) scale(1.05)}}
#con path{fill:none;stroke:rgba(255,222,150,.75);stroke-width:1.2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
#con.draw path{animation:dr 3.2s ease forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#con.love path{stroke:#ff9ec7;stroke-width:1.8;fill:rgba(255,120,170,.15)}
#con circle{fill:#fff3c4;opacity:0}
#con.draw circle{animation:pop .5s forwards}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
#con circle{transform-box:fill-box;transform-origin:center}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .9s;z-index:5}
.stage.on{opacity:1;pointer-events:auto}
.glow{filter:drop-shadow(0 0 22px #ffd56b);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
#star{width:84px;height:84px;border:0;cursor:pointer;background:radial-gradient(circle at 50% 40%,#fffbe0,#ffd56b 70%);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spinp 2.4s ease-in-out infinite}
@keyframes spinp{50%{transform:scale(1.12) rotate(8deg)}}
h1{font-family:'Parisienne',cursive;font-weight:400;font-size:2.3rem;color:var(--gold);margin:34px 0 8px;text-shadow:0 0 18px rgba(255,200,100,.5)}
.sub{margin:0;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;opacity:.7}
#cap{font-family:'Parisienne',cursive;font-weight:400;font-size:1.9rem;color:var(--gold);margin:0;position:absolute;top:11%;padding:0 24px}
.pill{position:absolute;bottom:12%;font-family:'Quicksand',sans-serif;font-weight:600;font-size:1rem;padding:13px 28px;border-radius:40px;border:1px solid rgba(255,217,138,.6);background:rgba(255,217,138,.12);color:var(--gold);cursor:pointer;opacity:0;transition:opacity 1s;box-shadow:0 0 22px rgba(255,200,100,.25)}
#s1.ready .pill{opacity:1}
.card{width:min(92vw,400px);max-height:92vh;overflow-y:auto;background:rgba(22,10,52,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,214,140,.4);border-radius:24px;padding:26px 22px 20px;box-shadow:0 0 40px rgba(255,190,110,.18);text-align:left}
.card h2{font-family:'Parisienne',cursive;font-weight:400;font-size:2.1rem;color:var(--gold);margin:0 0 10px}
.msg{font-family:'Dancing Script',cursive;font-weight:500;font-size:1.35rem;line-height:1.65;margin:0;min-height:5em}
.msg.typing::after{content:"▍";color:var(--gold);animation:bl .8s infinite}
@keyframes bl{50%{opacity:0}}
.fade{opacity:0;max-height:0;overflow:hidden;transition:opacity 1s,max-height 1s}
.fade.in{opacity:1;max-height:400px}
.sign{font-family:'Parisienne',cursive;font-size:1.7rem;color:var(--gold);text-align:right;margin:12px 0 4px}
.q{text-align:center;margin-top:8px}
.q h3{font-family:'Parisienne',cursive;font-weight:400;font-size:1.9rem;color:#ffb8d4;margin:0 0 12px}
.qb{position:relative;display:flex;gap:16px;justify-content:center;min-height:54px}
.qb button{font-family:'Quicksand',sans-serif;font-weight:600;font-size:1.05rem;border:0;border-radius:30px;padding:12px 30px;cursor:pointer}
#qy,.cov{background:linear-gradient(135deg,#ffcf70,#ff7aa8);color:#3a0d2b;box-shadow:0 0 20px rgba(255,140,170,.5)}
#qn{background:rgba(255,255,255,.14);color:#cdbfe0}
.cov{position:absolute!important;z-index:2;transform:scale(0);transition:transform .4s cubic-bezier(.2,1.6,.4,1);padding:0!important}
.cov.on{transform:scale(1.1)}
.done{display:none;font-family:'Parisienne',cursive;font-size:1.9rem;line-height:1.35;color:#ffc2da;text-align:center;margin:6px 0;animation:pop2 .8s}
@keyframes pop2{from{opacity:0;transform:scale(.7)}}
.lantern{position:fixed;bottom:-70px;width:26px;height:34px;border-radius:5px 5px 10px 10px;background:linear-gradient(#ffc36b,#ff7a7a);box-shadow:0 0 22px 6px rgba(255,160,80,.6);animation:up linear forwards;z-index:3;pointer-events:none}
.lantern::before{content:"";position:absolute;top:-5px;left:6px;width:14px;height:5px;background:#8a4b2a;border-radius:3px}
@keyframes up{50%{transform:translate(24px,-60vh)}to{transform:translate(-12px,-125vh);opacity:.2}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon"></div>
<svg id="con" viewBox="0 0 200 180"></svg>

<div class="stage on" id="s0">
  <div class="glow"><button id="star" aria-label="Catch the star"></button></div>
  <h1>A wish was left for you</h1>
  <p class="sub">tap the star to catch it</p>
</div>

<div class="stage" id="s1">
  <h2 id="cap">Every star here is a reason I think of you</h2>
  <button class="pill" id="read">Read my letter ✉</button>
</div>

<div class="stage" id="s2">
  <div class="card" id="card">
    <h2 id="to"></h2>
    <p class="msg" id="msg"></p>
    <div class="fade" id="after">
      <div class="sign" id="from"></div>
      <div class="q" id="q">
        <h3 id="qt"></h3>
        <div class="qb" id="qb"><button id="qy">Yes 💖</button><button id="qn">No</button><button id="qc" class="cov">Yes 💖</button></div>
      </div>
    </div>
    <div class="done" id="done"></div>
  </div>
</div>

<script>
/* ✏️ EDIT YOUR LETTER HERE */
var C = {
  to: "My Dearest Love,",
  msg: "I looked up at the sky tonight and every star reminded me of you. Since you came into my life, my days have been softer and my heart has been so much fuller. I wanted to give you a little piece of the night sky, because you are the brightest thing in mine. I love you, and I just really wanted you to know.",
  from: "Forever yours ✨",
  miss: "Do you miss me? 🥺",
  yes: "I knew it… I miss you too, more than all the stars in the sky 💫"
};
var $=function(id){return document.getElementById(id)};

/* ---------- starry sky ---------- */
var cv=$('sky'),cx=cv.getContext('2d'),W,H,stars=[],shoot=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;stars=[];for(var i=0;i<170;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,p:Math.random()*6.3,s:.01+Math.random()*.03})}
addEventListener('resize',size);size();
function shooter(){shoot.push({x:Math.random()*W*.7+W*.2,y:Math.random()*H*.3,vx:-7-Math.random()*4,vy:4+Math.random()*3,l:1})}
setInterval(function(){if(Math.random()<.6)shooter()},3200);
(function loop(){
  cx.clearRect(0,0,W,H);
  stars.forEach(function(s){s.p+=s.s;cx.globalAlpha=.35+.65*Math.abs(Math.sin(s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});
  shoot=shoot.filter(function(m){
    m.x+=m.vx;m.y+=m.vy;m.l-=.014;
    var g=cx.createLinearGradient(m.x,m.y,m.x-m.vx*7,m.y-m.vy*7);
    g.addColorStop(0,'rgba(255,240,200,'+Math.max(m.l,0)+')');g.addColorStop(1,'rgba(255,240,200,0)');
    cx.globalAlpha=1;cx.strokeStyle=g;cx.lineWidth=2;cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(m.x-m.vx*7,m.y-m.vy*7);cx.stroke();
    return m.l>0;
  });
  requestAnimationFrame(loop);
})();

/* ---------- heart constellation ---------- */
var NS="http://www.w3.org/2000/svg",con=$('con'),N=15,d='';
for(var i=0;i<N;i++){
  var t=i/N*Math.PI*2,x=100+16*Math.pow(Math.sin(t),3)*5.2,y=75-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*5;
  d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);
  var c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',2.6);
  c.style.animationDelay=(i*.2)+'s';con.appendChild(c);
}
var p=document.createElementNS(NS,'path');p.setAttribute('d',d+'Z');con.insertBefore(p,con.firstChild);
p.style.setProperty('--len',Math.ceil(p.getTotalLength())+5);

/* ---------- flow ---------- */
$('star').onclick=function(){
  shooter();shooter();
  $('s0').classList.remove('on');
  setTimeout(function(){
    $('s1').classList.add('on');con.classList.add('show','draw');
    setTimeout(function(){$('s1').classList.add('ready')},3600);
  },600);
};
$('read').onclick=function(){
  $('s1').classList.remove('on');con.className='draw dim';
  setTimeout(function(){$('s2').classList.add('on');typeIt()},500);
};

var typed=false,tm;
function typeIt(){
  $('to').textContent=C.to;$('from').textContent=C.from;$('qt').textContent=C.miss;
  var m=$('msg'),i=0;m.classList.add('typing');m.textContent='';
  tm=setInterval(function(){m.textContent=C.msg.slice(0,++i);if(i>=C.msg.length)finish()},32);
}
function finish(){
  if(typed)return;typed=true;clearInterval(tm);
  var m=$('msg');m.textContent=C.msg;m.classList.remove('typing');
  $('after').classList.add('in');setTimeout(coverNo,1800);
}
$('msg').onclick=finish;

/* ---------- Do you miss me? (No is covered by Yes) ---------- */
var qy=$('qy'),qn=$('qn'),qc=$('qc');
function coverNo(){
  qc.style.left=(qn.offsetLeft-6)+'px';qc.style.top=(qn.offsetTop-4)+'px';
  qc.style.width=(qn.offsetWidth+12)+'px';qc.style.height=(qn.offsetHeight+8)+'px';
  qc.classList.add('on');
}
qn.addEventListener('pointerenter',coverNo);
qn.addEventListener('pointerdown',coverNo);
function sayYes(){
  $('msg').style.display='none';$('q').style.display='none';
  var dn=$('done');dn.textContent=C.yes;dn.style.display='block';
  con.className='draw love';
  for(var i=0;i<4;i++)setTimeout(shooter,i*250);
  for(var j=0;j<26;j++)setTimeout(lantern,j*220);
}
[qy,qn,qc].forEach(function(b){b.addEventListener('click',sayYes)});

function lantern(){
  var l=document.createElement('div');l.className='lantern';
  l.style.left=(4+Math.random()*90)+'vw';
  var s=.7+Math.random()*.8;l.style.width=26*s+'px';l.style.height=34*s+'px';
  l.style.animationDuration=(9+Math.random()*6)+'s';
  document.body.appendChild(l);setTimeout(function(){l.remove()},15500);
}
</script>
</body>
</html>
